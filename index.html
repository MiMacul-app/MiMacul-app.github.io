<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiMacul</title>
<!-- Tipografía: la misma del Figma (Plus Jakarta Sans), cargada desde Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="stage">

  <!-- El "teléfono": aquí vive toda la app -->
  <div class="phone" id="app">
    <div class="statusbar" aria-hidden="true">
      <span>9:30</span>
      <svg width="54" height="14" viewBox="0 0 54 14"><rect x="0" y="9" width="3" height="5" rx="1" fill="#1e2a26"/><rect x="5" y="6" width="3" height="8" rx="1" fill="#1e2a26"/><rect x="10" y="3" width="3" height="11" rx="1" fill="#1e2a26"/><rect x="15" y="0" width="3" height="14" rx="1" fill="#1e2a26"/><rect x="26.5" y="1.5" width="23" height="11" rx="3.5" fill="none" stroke="#1e2a26" stroke-opacity=".4"/><rect x="28.5" y="3.5" width="16" height="7" rx="2" fill="#1e2a26"/></svg>
    </div>
    <main class="screen" id="screen"></main>
    <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    <div class="toast off" id="toast" role="status" aria-live="polite"></div>
    <div id="sheet"></div>
  </div>
</div>

<script src="js/imagenes.js"></script>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>

</body>
</html>
